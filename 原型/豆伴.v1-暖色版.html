<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豆伴 · 可点原型</title>
<style>
:root{
  --stage:#E9E3D5; --bg:#F5F1E8; --paper:#FFFDF8; --ink:#211D17; --ink2:#5A5246; --ink3:#857C6D; --line:rgba(33,29,23,.10);
  --me:#2F8F5B; --me-soft:#DCEFE3; --you:#F2A444; --you-soft:#FCEBD2; --gray:#CFC8BA; --warn:#A8481A;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(33,29,23,.06),0 10px 28px rgba(33,29,23,.09);
  font:100%/1.5 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#F3EEE2 0%,var(--stage) 60%);min-height:100vh;padding:clamp(16px,3vw,32px) 16px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[role=slider]:focus-visible{outline:3px solid rgba(47,143,91,.55);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- 舞台 ---------- */
.top{max-width:860px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.bean{width:26px;height:20px;background:var(--me);border-radius:60% 40% 55% 45%/55% 60% 40% 45%;transform:rotate(-18deg);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
.brand h1{font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:.75rem;color:var(--ink3);font-weight:500;letter-spacing:.02em}
.seg{display:flex;flex-wrap:wrap;background:rgba(33,29,23,.07);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--ink2);transition:transform .1s ease-out,background .2s,color .2s}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(33,29,23,.14)}
.which{display:none}
.stage{max-width:860px;margin:0 auto;display:flex;justify-content:center;gap:clamp(20px,5vw,56px);flex-wrap:wrap}
.device{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.device>h2{font-size:.8rem;font-weight:600;color:var(--ink2);letter-spacing:.04em}
.device>h2 span{color:var(--ink3);font-weight:500}
.phone{width:100%;height:min(700px,82vh);min-height:560px;background:#1A1815;border-radius:46px;padding:10px;box-shadow:0 30px 60px -20px rgba(33,29,23,.45),0 0 0 1px rgba(0,0,0,.4)}
.screen{position:relative;height:100%;border-radius:37px;overflow:hidden;background:var(--bg);isolation:isolate}
.time-ctl{min-height:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-size:.8rem;color:var(--ink2)}
.time-ctl button{padding:6px 12px;border-radius:999px;background:var(--paper);font-weight:600;box-shadow:0 1px 2px rgba(33,29,23,.12);transition:transform .1s ease-out}
.time-ctl button:active{transform:scale(.96)}
.time-ctl button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.foot{max-width:720px;margin:26px auto 0;font-size:.78rem;color:var(--ink3);text-align:center;line-height:1.7}
@media (max-width:759px){
  .which{display:flex}
  .stage[data-show=kid] #parent,.stage[data-show=parent] #kid{display:none}
}

/* ---------- 手机里通用 ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .42s;will-change:transform}
.view[data-pos=ahead]{transform:translateX(100%)}
.view[data-pos=behind]{transform:translateX(-28%);opacity:0;pointer-events:none}
.view[data-pos=ahead]{pointer-events:none}
.bar{flex:none;height:52px;padding:14px 12px 0;display:flex;align-items:center;gap:4px}
.bar .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .1s ease-out,background .15s}
.bar .back:active{transform:scale(.92);background:rgba(33,29,23,.08)}
.bar b{font-size:.95rem}
.body{flex:1;overflow-y:auto;padding:6px 18px 28px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hello{padding:30px 0 4px;font-size:1.55rem;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--ink2);font-size:.86rem}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 11px 6px 9px;border-radius:999px;background:var(--me-soft);color:#1E6A41;font-size:.76rem;font-weight:600}
.lbl{margin:24px 2px 9px;font-size:.74rem;font-weight:700;color:var(--ink3);letter-spacing:.08em}
.card{background:var(--paper);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
button.card{display:block;width:100%;text-align:left;transition:transform .12s ease-out}
button.card:active{transform:scale(.975)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#fff;background:var(--c,#999)}
.av.sm{width:30px;height:30px;font-size:.78rem}
.t1{font-weight:650;font-size:.95rem}
.t2{font-size:.8rem;color:var(--ink2)}
.star{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:#8A5A0B;background:var(--you-soft);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.chev{flex:none;opacity:.35}
.cta{display:block;width:100%;margin-top:18px;padding:15px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:.98rem;transition:transform .1s ease-out,opacity .2s}
.cta:active{transform:scale(.97)}
.cta.ghost{background:rgba(33,29,23,.07);color:var(--ink);margin-top:10px}
.cta.danger{background:var(--warn)}
.note{margin-top:18px;font-size:.76rem;color:var(--ink3);text-align:center;line-height:1.6}
.friends{display:flex;gap:14px;padding:2px}
.friends button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.76rem;font-weight:600;color:var(--ink2);transition:transform .1s ease-out}
.friends button:active{transform:scale(.93)}

/* ---------- 先猜后看 ---------- */
.q{padding:18px 4px 0;font-size:1.4rem;font-weight:750;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.who{display:flex;justify-content:space-between;margin:34px 2px 10px;font-size:.84rem;font-weight:700}
.who span:first-child{color:#1E6A41}.who span:last-child{color:#8A5A0B}
.who i{font-style:normal;font-weight:600;color:var(--ink2);margin-left:4px}
.split{--v:.5;position:relative;height:56px;border-radius:999px;background:var(--you);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.split .fill{position:absolute;inset:0;border-radius:999px;overflow:hidden}
.split .fill::before{content:"";position:absolute;inset:0;background:var(--me);transform-origin:left;transform:scaleX(var(--v))}
.split .fill::after{content:"";position:absolute;top:0;bottom:0;right:0;width:calc(var(--g,0)*100%);background:var(--gray);opacity:.9}
.split .knob{position:absolute;top:50%;left:calc(var(--v)*100%);width:34px;height:44px;margin:-22px 0 0 -17px;background:#FFFBEF;border-radius:58% 42% 55% 45%/52% 56% 44% 48%;box-shadow:0 2px 6px rgba(33,29,23,.35),inset -3px -4px 0 rgba(33,29,23,.07);transition:transform .15s ease-out}
.split.drag{cursor:grabbing}.split.drag .knob{transform:scale(1.12)}
.split.ro{cursor:default}.split.ro .knob{display:none}
.split .ghost{position:absolute;top:-9px;bottom:-9px;left:calc(var(--guess)*100%);width:0;border-left:2px dashed var(--ink);opacity:.55}
.split .ghost::after{content:"你猜的";position:absolute;top:-20px;left:-18px;width:40px;font-size:.68rem;font-weight:700;text-align:center}
.hint{margin-top:14px;text-align:center;font-size:.8rem;color:var(--ink3)}
.verdict{margin-top:30px;text-align:center;font-size:1.22rem;font-weight:750;letter-spacing:-.015em;line-height:1.3;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;text-wrap:balance}
.verdict.on{opacity:1;transform:none}
.verdict small{display:block;margin-top:6px;font-size:.8rem;font-weight:500;color:var(--ink2);letter-spacing:0}
.facts{margin-top:22px}
.facts .row{padding:11px 0;border-top:1px solid var(--line);font-size:.88rem}
.facts .row:first-child{border-top:0}
.facts .row b{margin-left:auto;font-weight:650}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}

/* ---------- 好友页 / 趋势 ---------- */
.spark{display:block;width:100%;height:auto;overflow:visible}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.part{background:var(--paper);border-radius:var(--r-md);padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.part .arrow{font-size:1.3rem;font-weight:800;line-height:1}
.part .arrow.up{color:var(--me)}.part .arrow.down{color:var(--warn)}.part .arrow.flat{color:var(--ink3)}
.part div:last-child{margin-top:5px;font-size:.72rem;color:var(--ink2);font-weight:600;line-height:1.35}
.trend .nums{display:flex;gap:14px;margin-top:10px;font-size:.78rem;color:var(--ink2)}
.trend .nums b{color:var(--ink);font-weight:650}
.up{color:var(--me)}.down{color:var(--warn)}

/* ---------- 家长页 ---------- */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;padding:8px 10px 14px;background:rgba(245,241,232,.72);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-top:1px solid rgba(255,255,255,.6)}
.tabs button{flex:1;padding:7px 4px;border-radius:12px;font-size:.74rem;font-weight:650;color:var(--ink3);transition:transform .1s ease-out,color .2s}
.tabs button:active{transform:scale(.94)}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs svg{display:block;margin:0 auto 3px}
#p-main .body{padding-bottom:92px}
.push{height:100%;transform-origin:50% 0;will-change:transform}
.remind{background:linear-gradient(180deg,#FFFDF8 0%,#FBF4E6 100%)}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--ink3)}
.say{margin-top:8px;font-size:1.06rem;font-weight:650;line-height:1.5;letter-spacing:-.005em}
.opener{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--me-soft);font-size:.9rem;line-height:1.55;color:#173F2A}
.opener b{display:block;font-size:.72rem;letter-spacing:.06em;color:#1E6A41;margin-bottom:3px}
.line{margin-top:12px;display:flex;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--ink2)}
.line svg{flex:none;margin-top:2px}
.quiet{text-align:center;padding:26px 18px}
.quiet .big{font-size:1.2rem;font-weight:750;letter-spacing:-.015em;margin-top:10px}
.quiet p{margin-top:6px;font-size:.86rem;color:var(--ink2)}
.tnote{margin-top:16px;padding:12px 14px;border-radius:var(--r-md);background:rgba(33,29,23,.05);font-size:.84rem;color:var(--ink2);text-align:left;line-height:1.6}
.tnote b{display:block;font-size:.72rem;letter-spacing:.06em;color:var(--ink3);margin-bottom:2px}
.link{display:block;margin:14px auto 0;padding:6px 10px;font-size:.82rem;font-weight:650;color:#1E6A41;border-radius:8px;transition:transform .1s ease-out}
.link:active{transform:scale(.96)}
.done{margin-top:14px;padding:11px 14px;border-radius:var(--r-md);background:rgba(33,29,23,.05);font-size:.84rem;color:var(--ink2)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px;text-align:center}
.cmp div{padding:12px 6px;border-radius:var(--r-md);background:rgba(33,29,23,.05)}
.cmp b{display:block;font-size:1.5rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.cmp span{font-size:.72rem;color:var(--ink2);font-weight:600}
.cmp .hit{background:var(--me-soft)}.cmp .miss{background:var(--you-soft)}
.check{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:.85rem}
.check:first-of-type{border-top:0}
.check svg{flex:none;margin-top:2px}

/* ---------- 底部弹层 ---------- */
.scrim{position:absolute;inset:0;z-index:5;background:#1A1815;opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;display:flex;flex-direction:column;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(33,29,23,.25);transform:translateY(105%);will-change:transform}
.grab{flex:none;padding:10px 0 6px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:38px;height:5px;margin:0 auto;border-radius:3px;background:rgba(33,29,23,.2)}
.sheet h3{flex:none;padding:2px 20px 10px;font-size:1.05rem;letter-spacing:-.01em}
.sheet .in{overflow-y:auto;padding:0 20px 26px;scrollbar-width:none}
.sheet .in::-webkit-scrollbar{display:none}
.sheet h4{margin:18px 0 8px;font-size:.72rem;letter-spacing:.08em;color:var(--ink3)}
.sheet h4:first-child{margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:.72rem}
.tbl th{font-weight:600;color:var(--ink3);text-align:right;padding:4px 5px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:4px 5px;border-top:1px solid var(--line)}
.tbl tr.wk td{border-top:0;padding-top:9px;font-weight:700;color:var(--ink2)}
.tbl tr.now td{background:rgba(242,164,68,.13)}
.never{display:flex;flex-wrap:wrap;gap:6px}
.never span{padding:4px 10px;border-radius:999px;background:rgba(33,29,23,.06);font-size:.76rem;color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(33,29,23,.35)}
.dev{padding:11px 13px;border-radius:var(--r-sm);background:rgba(33,29,23,.05);font-size:.8rem;color:var(--ink2);line-height:1.6}
.rule{padding:7px 0;border-top:1px solid var(--line);font-size:.82rem}
.rule:first-of-type{border-top:0}
.opt{display:block;width:100%;margin-top:8px;padding:14px 16px;border-radius:var(--r-md);background:rgba(33,29,23,.05);text-align:left;font-weight:650;transition:transform .1s ease-out,background .15s}
.opt:active{transform:scale(.975);background:rgba(33,29,23,.1)}

@media (prefers-reduced-motion:reduce){.view,.verdict,.seg button,.cta,button.card{transition:opacity .2s!important}.view[data-pos=ahead],.view[data-pos=behind]{transform:none;opacity:0}}
@media (prefers-reduced-transparency:reduce){.tabs{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media (prefers-contrast:more){:root{--line:rgba(33,29,23,.4);--ink2:#2E2921;--ink3:#453E33}.tabs{background:var(--bg);border-top:1px solid var(--ink)}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="bean" aria-hidden="true"></div><h1>豆伴<small>可点原型 · 演示数据</small></h1></div>
  <div class="seg" id="cases" role="group" aria-label="切换情形"></div>
  <div class="seg which" role="group" aria-label="切换页面">
    <button data-show="kid" aria-pressed="true">孩子页</button><button data-show="parent" aria-pressed="false">家长页</button>
  </div>
</header>

<main class="stage" data-show="kid">
  <section class="device" id="kid">
    <h2>孩子页 <span>· 回家同步之后</span></h2>
    <div class="phone"><div class="screen">
      <div class="view" id="k-home"></div>
      <div class="view" id="k-guess"></div>
      <div class="view" id="k-reveal"></div>
      <div class="view" id="k-friend"></div>
    </div></div>
    <div class="time-ctl"></div>
  </section>

  <section class="device" id="parent">
    <h2>家长页 <span>· 每周最多一条提醒</span></h2>
    <div class="phone"><div class="screen">
      <div class="push"><div class="view" id="p-main" data-pos="active"><div class="body" id="p-body"></div></div></div>
      <nav class="tabs" role="tablist" aria-label="家长页">
        <button role="tab" data-tab="week"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>本周</button>
        <button role="tab" data-tab="trend"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg>趋势</button>
        <button role="tab" data-tab="trust"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>好友与录音</button>
      </nav>
      <div class="scrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="grab"></div><h3 id="sh-title"></h3><div class="in"></div></div>
    </div></div>
    <div class="time-ctl" id="time"></div>
  </section>
</main>

<p class="foot">数字是示意，不是实测。助手的每一句话和每一次「提醒 / 不提醒」的决定，都是 2026-09-19 真实模型输出（claude-fable-5-1），并通过了程序校验。<br>好友昵称只在这台手机上显示；模型看到的只有「好友A」这样的代号，看不到音频、文字和姓名。</p>

/* ---------- 弹簧：从当前值出发，随时可被打断，松手的速度能接上 ---------- */
function spring({from, to, velocity=0, response=.38, damping=1, onUpdate, onDone}){
  if (REDUCED){ onUpdate(to); onDone && onDone(); return {cancel(){}, x:to, v:0}; }
  const k = (2*Math.PI/response)**2, c = 4*Math.PI*damping/response, span = Math.max(1e-6, Math.abs(to-from), Math.abs(velocity)*.1);
  const st = {x:from, v:velocity, cancel(){ cancelAnimationFrame(raf); }};
  let last = performance.now(), raf;
  const step = t => { const dt = Math.min(.032, (t-last)/1000)/4; last = t;
    for (let i = 0; i < 4; i++){ st.v += (-k*(st.x-to) - c*st.v)*dt; st.x += st.v*dt; }
    if (Math.abs(st.x-to) < span*.002 && Math.abs(st.v) < span*.02){ st.x = to; onUpdate(to); onDone && onDone(); return; }
    onUpdate(st.x); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step); return st;
}
const project = (v, d=.998) => (v/1000)*d/(1-d);
const rubber = (over, dim, c=.55) => (over*dim*c)/(dim + c*Math.abs(over));

/* ---------- 和过去的自己比 ---------- */
const sym = sh => Math.min(sh, 100-sh)/50;
const inti = f => f ? f.minutes*f.days*sym(f.share) : 0;          // 时间 × 天数 × 对称程度
function arrow(nowV, past){ const base = past.length ? past.reduce((a,b) => a+b, 0)/past.length : nowV;
  if (!base && !nowV) return "flat"; const d = base ? (nowV-base)/base : 1; return d > .1 ? "up" : d < -.1 ? "down" : "flat"; }
const ARW = {up:"↑", down:"↓", flat:"→"};
function series(f, fn){ return weeks().map(w => w.friends[f] ? fn(w.friends[f]) : null); }
function spark(vals, color, h=44){ const W = 260, pts = vals.map((v, i) => v == null ? null : [vals.length > 1 ? 8 + i*(W-16)/(vals.length-1) : W/2, v]);
  const real = pts.filter(Boolean), max = Math.max(...real.map(p => p[1]), 1e-6), y = v => h - 6 - (v/max)*(h-14);
  const d = real.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${y(p[1]).toFixed(1)}`).join(" "), e = real.at(-1);
  return `<svg class="spark" viewBox="0 0 ${W} ${h}" role="img" aria-label="近几周的升降"><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>${real.map(p => `<circle cx="${p[0]}" cy="${y(p[1])}" r="${p === e ? 5.5 : 3}" fill="${p === e ? color : "#FFFDF8"}" stroke="${color}" stroke-width="2"/>`).join("")}</svg>`; }

function bindSplit(el, s){ let raw = 50, grab = 0, anim;
  const set = v => { raw = Math.max(0, Math.min(100, v)); S.kid.guess = Math.round(raw/5)*5;
    paint(el, raw); $("#g-who").innerHTML = whoLine(s, S.kid.guess); el.setAttribute("aria-valuenow", S.kid.guess); el.setAttribute("aria-valuetext", "我 " + cheng(S.kid.guess)); };
  const at = e => { const r = el.getBoundingClientRect(); return (e.clientX - grab - r.left)/r.width*100; };
  el.addEventListener("pointerdown", e => { anim && anim.cancel(); try { el.setPointerCapture(e.pointerId); } catch {} el.classList.add("drag");
    const k = $(".knob", el).getBoundingClientRect(), cx = k.left + k.width/2;
    grab = Math.abs(e.clientX - cx) <= 28 ? e.clientX - cx : 0;            // 抓在豆子上：保留抓取偏移；点在别处：豆子过来
    set(at(e)); });
  el.addEventListener("pointermove", e => { if (el.classList.contains("drag")) set(at(e)); });
  const end = e => { if (!el.classList.contains("drag")) return; el.classList.remove("drag");
    anim = spring({from:raw, to:Math.round(raw/5)*5, response:.25, onUpdate:v => { raw = v; paint(el, v); }}); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", e => { const d = {ArrowLeft:-5, ArrowDown:-5, ArrowRight:5, ArrowUp:5}[e.key];
    if (d) set(S.kid.guess + d); else if (e.key === "Home") set(0); else if (e.key === "End") set(100); else return; e.preventDefault(); }); }

function parWeek(){ const c = cur(), o = c.assistant, total = weeks().at(-1).total_days;
  let card;
  if (o.remind && !alive(o.friend)) card = `<div class="card quiet">${ICON.calm}<div class="big">这周不提醒</div><p>和${NICK[o.friend]}的数字，已随好友关系一并删除。</p></div>`;
  else if (o.remind){ const nowV = now()[o.friend][o.metric], nx = S.par.next && c.next[S.par.next], hit = nx != null && (o.recovery_op === ">=" ? nx >= o.recovery_value : nx <= o.recovery_value);
    card = `<div class="card remind"><div class="kicker">这周值得留意的一个变化</div>
      <div class="say">${nick(o.sentence)}</div>
      <div class="opener"><b>可以这样开口</b>${nick(o.opener)}</div>
      <div class="line">${ICON.flag}<span>下周自动对照：${recoveryText(o)}</span></div>
      ${S.par.reason ? `<div class="done">已记下：${esc(S.par.reason)}。下周的数字出来后自动对照，不用你再做什么。</div>` : `<button class="cta" data-act="talked">聊过了</button>`}
      <button class="link" data-act="ai">AI 读到了什么？</button></div>
      ${nx != null ? `<div class="lbl">下一周 · 自动对照</div><div class="card"><div class="t1">${hit ? "恢复了" : "还没有恢复"}</div>
        <div class="cmp"><div><b>${nowV}${UNIT[o.metric].trim()}</b><span>提醒那一周</span></div><span aria-hidden="true">→</span><div class="${hit ? "hit" : "miss"}"><b>${nx}${UNIT[o.metric].trim()}</b><span>下一周</span></div></div>
        <div class="t2" style="margin-top:12px">${hit ? `过了恢复线（${o.recovery_value}${UNIT[o.metric].trim()}）。这条提醒到此结束。` : `还没到恢复线（${o.recovery_value}${UNIT[o.metric].trim()}）。下周由助手决定：换一种开口方式、调低恢复线，或者不再提。`}</div></div>` : ""}`; }
  else card = `<div class="card quiet">${ICON.calm}<div class="big">这周不提醒</div><p>没有需要特别留意的变化。</p>
      ${o.trend_note ? `<div class="tnote"><b>趋势页的一句话</b>${nick(o.trend_note)}</div>` : ""}
      <button class="link" data-act="ai">AI 读到了什么？为什么不提醒？</button></div>`;
  return `<div class="hello">小明的这一周</div><div class="sub">本周有记录 ${total} 天 · 每周最多一条提醒</div><div style="height:18px"></div>${card}
    <div class="note">这里没有播放键。录音算完就删，<br>留下的只有数字。</div>`; }

function parTrend(){ const fs = [...new Set(weeks().flatMap(w => Object.keys(w.friends)))].filter(alive);
  return `<div class="hello">趋势</div><div class="sub">只和孩子自己的过去比，不和别人比</div><div style="height:18px"></div>` + fs.map(f => { const n = now()[f], sh = series(f, x => x.minutes ? x.share : null), real = sh.filter(v => v != null);
    const past = k => series(f, x => x[k]).slice(0, -1).filter(v => v != null), am = arrow(n ? n.minutes : 0, past("minutes")), ad = arrow(n ? n.days : 0, past("days"));
    return `<div class="card trend"><div class="row">${av(f, 1)}<div class="grow t1">${NICK[f]}</div><div class="t2">${n && n.minutes ? `孩子说了 ${n.share}%` : ""}</div></div>
      ${n && n.minutes ? `<div style="margin-top:10px">${spark(sh, COLOR[f])}</div><div class="t2" style="display:flex;justify-content:space-between"><span>${real[0]}%</span><span>说话占比 · 近 ${sh.length} 周</span><span>${real.at(-1)}%</span></div>
      <div class="nums"><span>一起说话 <b>${n.minutes} 分钟</b> <span class="${am}">${ARW[am]}</span></span><span>有记录 <b>${n.days} 天</b> <span class="${ad}">${ARW[ad]}</span></span></div>`
      : `<div class="t2" style="margin-top:10px">这周没有和${NICK[f]}的记录。<br>孩子按键才录，没有记录不等于没在一起。</div>`}</div>`; }).join(""); }

function parTrust(){ const fs = [...new Set(weeks().flatMap(w => Object.keys(w.friends)))].filter(alive);
  return `<div class="hello">好友与录音</div><div class="sub">被录的孩子事先知道、当场知道、事后能删</div>
    <div class="lbl">录音在哪</div><div class="card">
      <div class="check">${ICON.ok}<span>手机里的录音：<b>0 个</b>。算完就删，删完回读确认过。</span></div>
      <div class="check">${ICON.ok}<span>豆子里的录音：<b>0 个</b>。</span></div>
      <div class="check">${ICON.ok}<span>这个 App 没有播放键，家长听不到任何一句。</span></div></div>
    <div class="lbl">怎么才会录</div><div class="card">
      <div class="check">${ICON.ok}<span>孩子自己按侧键，灯亮了才录；App 没法远程打开豆子。</span></div>
      <div class="check">${ICON.ok}<span>开录时两个人各说一句「我是××，开始啦」。跳过这一句，算不出数。</span></div></div>
    <div class="lbl">好友</div>` + (fs.map(f => `<div class="card"><div class="row">${av(f, 1)}<div class="grow"><div class="t1">${NICK[f]}</div><div class="t2">双方家长已确认</div></div><button class="link" style="margin:0;color:var(--warn)" data-act="remove" data-f="${f}">解除</button></div></div>`).join("") || `<div class="card t2">没有好友了。</div>`); }

function timeCtl(){ const c = cur(), o = c.assistant, show = o.remind && alive(o.friend) && S.par.reason && S.par.tab === "week";
  $("#time").innerHTML = show ? `<span>演示：快进到下一周 →</span><button data-next="yes" aria-pressed="${S.par.next === "yes"}">恢复了</button><button data-next="no" aria-pressed="${S.par.next === "no"}">还没有</button>` : ""; }

/* ---------- 弹层内容 ---------- */
function aiSheet(){ const c = cur(), o = c.assistant, ws = weeks();
  const rows = ws.map((w, i) => `<tr class="wk"><td colspan="5">${i === ws.length-1 ? "本周" : `${ws.length-1-i} 周前`} · 有记录 ${w.total_days} 天</td></tr>` +
    Object.entries(w.friends).map(([f, m]) => `<tr class="${i === ws.length-1 ? "now" : ""}"><td>${f}</td><td>${m.share}</td><td>${m.monolog_s}</td><td>${m.minutes}</td><td>${m.days}</td></tr>`).join("")).join("");
  const checks = c.errors.length ? c.errors.map(e => `<div class="check">${ICON.no}<span>${esc(e)}</span></div>`).join("")
    : ["指标在白名单内（四项之一，亲密度组合分不在内）", o.remind ? "恢复线下周测得出，而且本周还没满足" : "不提醒：没有恢复线要查", "没有禁用措辞（不判定、不贴标签）"].map(t => `<div class="check">${ICON.ok}<span>${t}</span></div>`).join("");
  const zh = s => esc(s).replace(/minutes/g, "时长").replace(/days/g, "次数").replace(/share/g, "占比");
  return ["AI 读到了什么", `<h4>发给助手的全部内容</h4>
    <table class="tbl mono"><tr><th>代号</th><th>占比%</th><th>独白s</th><th>时长min</th><th>天数</th></tr>${rows}</table>
    <h4>从来不发</h4><div class="never"><span>音频</span><span>转写文字</span><span>摘要</span><span>姓名</span><span>声纹</span></div>
    <h4>助手的决定 · ${o.remind ? "提醒" : "本周不提醒"}</h4><div class="dev"><b>它给开发者的理由：</b>${esc(o.reason)}</div>
    <h4>程序校验</h4>${checks}
    <h4>同一批数字，固定阈值规则会报 ${c.rule.length} 条</h4>${c.rule.map(r => `<div class="rule mono">${zh(r)}</div>`).join("")}
    <div class="note" style="text-align:left">模型 claude-fable-5-1，2026-09-19 实测输出；数字为示意。</div>`]; }
const reasonSheet = () => ["聊过了 · 大概是因为？", ["换座位了", "闹别扭了", "没什么事"].map(r => `<button class="opt" data-reason="${r}">${r}</button>`).join("") + `<div class="note" style="text-align:left">选一个就行。助手下周会把它当成一条输入，比如「换座位了」就把现状当新的基线。</div>`];
const removeSheet = f => [`解除和${NICK[f]}的好友关系？`, `<p class="t2" style="font-size:.9rem;line-height:1.7">解除后，和${NICK[f]}有关的全部数字会一并删除，两边都看不到了，不能恢复。</p><button class="cta danger" data-confirm-remove="${f}">解除并删除数字</button><button class="cta ghost" data-act="close">再想想</button>`];

/* ---------- 弹层：弹簧驱动，拖得动，松手看速度的方向 ---------- */
const sheet = $(".sheet"), scrim = $(".scrim"), push = $(".push");
let sp = 1, sAnim, lastFocus;                                    // sp：0 全开，1 全关
function sheetPaint(p){ sp = p; const o = Math.max(0, 1-p); sheet.style.transform = `translateY(${p*105}%)`; scrim.style.opacity = o*.38;
  push.style.transform = `scale(${1 - Math.min(1, o)*.045})`; push.style.borderRadius = o > .01 ? "24px" : ""; push.style.overflow = o > .01 ? "hidden" : ""; }
function sheetTo(target, velocity=0){ sAnim && sAnim.cancel(); scrim.style.pointerEvents = target ? "none" : "auto";
  sAnim = spring({from:sp, to:target, velocity, response:.34, damping:velocity ? .82 : 1, onUpdate:sheetPaint,
    onDone:() => { if (target){ sheet.hidden = true; $("#p-main").inert = false; $(".tabs").inert = false; lastFocus && lastFocus.focus({preventScroll:true}); } }}); }
function openSheet([title, html]){ lastFocus = document.activeElement; $("#sh-title").textContent = title; $(".in", sheet).innerHTML = html; $(".in", sheet).scrollTop = 0;
  sheet.hidden = false; $("#p-main").inert = true; $(".tabs").inert = true; sheetTo(0); sheet.setAttribute("tabindex", "-1"); sheet.focus({preventScroll:true}); }
const closeSheet = (v=0) => sheetTo(1, v);
sheet.hidden = true;
(() => { const g = $(".grab"); let y0, h, hist;
  g.addEventListener("pointerdown", e => { sAnim && sAnim.cancel(); try { g.setPointerCapture(e.pointerId); } catch {} h = sheet.offsetHeight*1.05; y0 = e.clientY - sp*h; hist = [[e.clientY, e.timeStamp]]; });
  g.addEventListener("pointermove", e => { if (!hist) return; let d = e.clientY - y0; if (d < 0) d = -rubber(-d, h, .3);
    sheetPaint(d/h); hist.push([e.clientY, e.timeStamp]); if (hist.length > 5) hist.shift(); });
  const end = e => { if (!hist) return; const a = hist[0], b = hist.at(-1), v = b[1] > a[1] ? (b[0]-a[0])/(b[1]-a[1])*1000 : 0; hist = null;
    const landing = sp*h + project(v), close = landing > h*.45; sheetTo(close ? 1 : 0, v/h); };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end); })();
scrim.addEventListener("click", () => closeSheet());
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

/* ==================== 事件与启动 ==================== */
function resetAll(){ S.kid = {view:"home", si:0, guess:50, from:"home"}; S.par.tab = "week"; S.par.reason = null; S.par.next = null;
  if (!sheet.hidden){ sAnim && sAnim.cancel(); sheetPaint(1); sheet.hidden = true; $("#p-main").inert = false; $(".tabs").inert = false; }
  kidHome(); kidGo("home"); parent(); }
$("#cases").innerHTML = UI.map((u, i) => `<button data-ci="${i}" aria-pressed="${i === 0}">${u.tab}</button>`).join("");
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.ci != null){ S.ci = +d.ci; $$("#cases button").forEach(x => x.setAttribute("aria-pressed", x === b)); resetAll(); }
  else if (d.show){ $(".stage").dataset.show = d.show; $$(".which button").forEach(x => x.setAttribute("aria-pressed", x === b)); }
  else if (d.sess != null){ S.kid.si = +d.sess; kidGuess(); kidGo("guess"); }
  else if (d.go === "reveal"){ kidReveal(); kidGo("reveal"); }
  else if (d.go){ if (d.go === "home") kidHome(); kidGo(d.go); }
  else if (d.friend){ S.kid.from = S.kid.view; kidFriend(d.friend); kidGo("friend"); }
  else if (d.tab){ S.par.tab = d.tab; parent(); }
  else if (d.act === "ai") openSheet(aiSheet());
  else if (d.act === "talked") openSheet(reasonSheet());
  else if (d.act === "remove") openSheet(removeSheet(d.f));
  else if (d.act === "close") closeSheet();
  else if (d.reason){ S.par.reason = d.reason; closeSheet(); parent(); }
  else if (d.confirmRemove){ S.par.removed[S.ci + d.confirmRemove] = true; closeSheet(); parent(); kidHome(); kidGo("home"); }
  else if (d.next){ S.par.next = S.par.next === d.next ? null : d.next; parent(); const el = $("#p-body"); el.scrollTo({top:el.scrollHeight, behavior:REDUCED ? "auto" : "smooth"}); } });
if (!REAL.length) document.body.innerHTML = '<p style="padding:40px;text-align:center">还没有注入真实数据（REAL 为空）。</p>'; else resetAll();
</script>
</body>
