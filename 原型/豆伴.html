<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
<title>豆伴 · 可点原型</title>
<style>
/* 美术范式：Animal Island UI（MIT，guokaigdg/animal-island-ui）。令牌取自其 :root 实测值；样式为本页自写，未引入其代码与素材。 */
:root{
  --stage:#88C9A1; --bg:#F8F8F0; --paper:#F7F3DF; --white:#FFFDF6;
  --ink:#794F27; --ink2:#725D42; --ink3:#7D6F58; --line:#E8E2D6; --line2:#DCD8D1;
  --teal:#19C8B9; --teal-d:#08766D; --teal-soft:#E6F9F6; --on-teal:#0A4A44;
  --yellow:#F5C31C; --yellow-d:#C99A0A; --on-yellow:#5C3A18;
  --me:#19C8B9; --you:#F09A5A; --you-d:#A35518; --you-soft:#FDEBDC; --gray:#DCD8D1;
  --ok:#6FBA2C; --warn:#C94444; --hard:#BDAEA0;
  --r-lg:24px; --r-md:18px; --r-sm:16px;
  --ease:cubic-bezier(.4,0,.2,1);
  font:600 100%/1.5715 Nunito,"Noto Sans SC",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); -webkit-text-size-adjust:100%; letter-spacing:.01em;
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;padding:clamp(16px,3vw,30px) 16px 44px;background-color:var(--stage);
  background-image:radial-gradient(circle,rgba(90,160,105,.4) 1.5px,transparent 1.5px),radial-gradient(circle,rgba(110,180,125,.3) 1px,transparent 1px);
  background-size:28px 28px,14px 14px;background-position:0 0,7px 7px}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[role=slider]:focus-visible,summary:focus-visible{outline:3px solid var(--on-teal);outline-offset:2px}
.view:focus,#p-body:focus,.sheet:focus{outline:0}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:0}

/* ---------- 舞台 ---------- */
.top{max-width:880px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand small{font-size:.78rem;color:var(--on-teal);font-weight:700;max-width:30em;line-height:1.5}
.layer{position:relative;display:inline-flex;font-size:1.35rem;height:2.1em;margin:.3em 0 0 .26em}
.layer::before{content:"";position:absolute;inset:-.3em .65em 0 -.26em;background:var(--yellow-d);border-radius:.35em}
.layer .front{position:relative;display:inline-flex;align-items:center;height:2.1em;padding:0 1.3em;border-radius:.35em;background:var(--yellow);color:var(--on-yellow);font-weight:900;letter-spacing:.08em;box-shadow:0 .1em .16em rgba(0,0,0,.08)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:4px;background:var(--bg);border:2px solid var(--line);border-radius:999px}
.seg button{display:inline-flex;align-items:center;gap:7px;padding:7px 15px 7px 12px;border-radius:999px;font-size:.84rem;font-weight:700;color:var(--ink2);transition:all .25s var(--ease)}
.seg button::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--line2);transition:all .25s var(--ease)}
.seg button:active{transform:translateY(1px)}
.seg button[aria-pressed=true]{background:var(--teal);color:var(--on-teal)}
.seg button[aria-pressed=true]::before{background:var(--ink);border-color:var(--ink)}
.which{display:none}
.stage{max-width:880px;margin:0 auto;display:flex;justify-content:center;gap:clamp(20px,5vw,60px);flex-wrap:wrap}
.device{width:min(344px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.device>h2{padding:5px 14px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:.78rem;font-weight:800;color:var(--ink)}
.device>h2 span{color:var(--ink3);font-weight:600}
.phone{width:100%;height:min(680px,76vh);min-height:560px;background:var(--white);border:3px solid #fff;border-radius:46px;padding:9px;box-shadow:0 9px 0 #5FA97C,0 26px 40px -8px rgba(30,80,50,.35)}
.screen{position:relative;height:100%;border-radius:35px;overflow:hidden;background:var(--bg);isolation:isolate;border:2px solid var(--line)}
.time-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:12px;font-size:.78rem;font-weight:800;color:var(--ink2)}
.done .time-ctl{color:#3F6E15}.done .time-ctl button{border:2px solid #CFE6B2}
.time-ctl button{padding:7px 15px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800;box-shadow:0 4px 0 var(--hard);transition:all .15s var(--ease)}
.time-ctl button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--hard)}
.time-ctl button[aria-pressed=true]{background:var(--teal);color:var(--on-teal);box-shadow:0 4px 0 var(--teal-d)}
.cap,.foot{max-width:720px;margin:26px auto 0;padding:12px 18px;border-radius:var(--r-md);background:rgba(248,248,240,.85);font-size:.76rem;font-weight:600;color:var(--ink2);text-align:center;line-height:1.75}
.cap{margin:-6px auto 22px;text-align:left}.cap b{color:var(--ink);font-weight:900}
.seg button,.time-ctl button,.link{position:relative}
.seg button::after,.time-ctl button::after,.link::after{content:"";position:absolute;inset:-6px 0}
@media (max-width:759px){
  .which{display:flex}
  .stage[data-show=kid] #parent,.stage[data-show=parent] #kid{display:none}
}

/* ---------- 手机里通用 ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background-color:var(--bg);
  background-image:radial-gradient(circle,rgba(190,178,150,.28) 1.5px,transparent 1.5px);background-size:22px 22px;
  transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .42s;will-change:transform}
.view[data-pos=ahead]{transform:translateX(100%);pointer-events:none}
.view[data-pos=behind]{transform:translateX(-28%);opacity:0;pointer-events:none}
.bar{flex:none;height:58px;padding:14px 12px 0;display:flex;align-items:center;gap:6px}
.bar .back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:2px solid var(--line);transition:all .15s var(--ease)}
.bar .back:active{transform:translateY(2px);background:var(--paper)}
.bar b{font-size:.95rem;font-weight:800}
.body{flex:1;overflow-y:auto;padding:6px 18px 28px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hello{padding:28px 0 4px;font-size:1.6rem;font-weight:900;letter-spacing:.01em;line-height:1.2}
.sub{color:var(--ink2);font-size:.84rem;font-weight:600}
.pill.bad,.redbar{background:#FBE3E3;border:1.5px solid #EDB4B4;color:#8E2B2B}
.redbar{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;padding:10px 12px;border-radius:var(--r-md);font-size:.8rem;font-weight:800;line-height:1.5}.redbar svg{flex:none;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 12px 5px 9px;border-radius:999px;background:#EEF7E2;border:1.5px solid #CFE6B2;color:#3F6E15;font-size:.76rem;font-weight:700}
.lbl{margin:24px 2px 10px;font-size:.78rem;font-weight:800;color:var(--ink2);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:12px}
button.card{display:block;width:100%;text-align:left;background:var(--white);box-shadow:0 5px 0 var(--hard);border-color:var(--white);transition:all .2s var(--ease)}
button.card:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--hard)}
button.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hard)}
button.card+button.card{margin-top:15px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1rem;color:#fff;background:var(--c,#999);border:3px solid #fff;box-shadow:0 2px 0 rgba(121,79,39,.18);text-shadow:0 1px 1px rgba(0,0,0,.15)}
.av.sm{width:32px;height:32px;font-size:.8rem;border-width:2px}
.t1{font-weight:800;font-size:.96rem}
.t2{font-size:.8rem;color:var(--ink2);font-weight:600}
.star{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:800;color:var(--on-yellow);background:#FCEFB4;border:1.5px solid #F2D96B;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.chev{flex:none;opacity:.5}
.cta{display:block;width:100%;margin-top:20px;padding:13px 15px;border-radius:50px;background:var(--yellow);color:var(--on-yellow);font-weight:900;font-size:1rem;letter-spacing:.06em;box-shadow:0 5px 0 var(--yellow-d);transition:all .2s var(--ease)}
.cta:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--yellow-d)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-d)}
.cta.ghost{background:var(--white);color:var(--ink);box-shadow:0 5px 0 var(--hard);margin-top:16px}
.cta.ghost:hover{box-shadow:0 6px 0 var(--hard)}.cta.ghost:active{box-shadow:0 2px 0 var(--hard)}
.cta.danger{background:var(--warn);color:#fff;box-shadow:0 5px 0 #8E2B2B}
.cta.danger:hover{box-shadow:0 6px 0 #8E2B2B}.cta.danger:active{box-shadow:0 2px 0 #8E2B2B}
.note{margin-top:20px;font-size:.75rem;font-weight:600;color:var(--ink3);text-align:center;line-height:1.7}
.friends{display:flex;gap:16px;padding:2px}
.friends button{min-width:44px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.76rem;font-weight:800;color:var(--ink2);transition:transform .15s var(--ease)}
.friends button:hover{transform:translateY(-2px)}.friends button:active{transform:translateY(2px)}

/* ---------- 先猜后看 ---------- */
.q{padding:16px 4px 0;font-size:1.42rem;font-weight:900;line-height:1.3;text-wrap:balance}
.who{display:flex;justify-content:space-between;margin:32px 2px 12px;font-size:.86rem;font-weight:900}
.who span:first-child{color:var(--teal-d)}.who span:last-child{color:var(--you-d)}
.who i{font-style:normal;font-weight:700;color:var(--ink2);margin-left:5px}
.split{--v:.5;position:relative;height:58px;border-radius:999px;background:var(--you);border:3px solid #fff;box-shadow:0 5px 0 var(--hard);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.split .fill{position:absolute;inset:0;border-radius:999px;overflow:hidden;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.2) 0 9px,transparent 9px 20px)}
.split .fill::before{content:"";position:absolute;inset:0;background-color:var(--me);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 9px,transparent 9px 20px);transform-origin:left;transform:scaleX(var(--v))}
.split .knob{position:absolute;top:50%;left:calc(var(--v)*100%);width:36px;height:46px;margin:-23px 0 0 -18px;background:#FFFBEF;border:3px solid var(--ink);border-radius:58% 42% 55% 45%/52% 56% 44% 48%;box-shadow:0 3px 0 rgba(121,79,39,.35);transition:transform .15s var(--ease)}
.split.drag{cursor:grabbing}.split.drag .knob{transform:scale(1.12) rotate(-6deg)}
.split.ro{cursor:default}.split.ro .knob{display:none}
.split .ghost{position:absolute;top:-10px;bottom:-10px;left:calc(var(--guess)*100%);width:0;border-left:3px dashed var(--ink)}
.split .ghost::after{content:"你猜的";position:absolute;bottom:-20px;left:-22px;width:44px;font-size:.68rem;font-weight:900;text-align:center}
.hint{margin-top:16px;text-align:center;font-size:.8rem;font-weight:600;color:var(--ink3)}
.verdict{margin-top:40px;text-align:center;font-size:1.22rem;font-weight:900;line-height:1.35;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .4s,transform .4s var(--ease);text-wrap:balance}
.verdict.on{opacity:1;transform:none}
.verdict small{display:block;margin-top:6px;font-size:.8rem;font-weight:600;color:var(--ink2)}
.facts{margin-top:22px;padding:6px 16px}
.facts .row{padding:11px 0;border-top:2px dashed var(--line);font-size:.86rem;font-weight:700}
.facts .row:first-child{border-top:0}
.facts .row b{margin-left:auto;font-weight:900}
.dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}

/* ---------- 好友页 / 趋势 ---------- */
.spark{display:block;width:100%;height:auto;overflow:visible}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.part{background:var(--white);border:2px solid var(--line);border-radius:var(--r-md);padding:12px 8px;text-align:center}
.part .arrow{font-size:1.4rem;font-weight:900;line-height:1}
.part .arrow.up,.up{color:#3F6E15}.part .arrow.down,.down{color:var(--you-d)}.part .arrow.flat,.flat{color:var(--ink3)}
.part div:last-child{margin-top:6px;font-size:.72rem;color:var(--ink2);font-weight:700;line-height:1.4}
.trend .nums{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;font-weight:600;color:var(--ink2)}
.trend .nums b{color:var(--ink);font-weight:900}

/* ---------- 家长页 ---------- */
.tabs{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;gap:2px;padding:5px;background:rgba(248,248,240,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:2px solid var(--line);border-radius:26px;box-shadow:0 4px 0 rgba(189,174,160,.55)}
.tabs button{flex:1;padding:7px 4px 6px;border-radius:20px;font-size:.72rem;font-weight:800;color:var(--ink3);transition:all .25s var(--ease)}
.tabs button:active{transform:translateY(1px)}
.tabs button[aria-current=page]{background:var(--teal);color:var(--on-teal)}
.tabs svg{display:block;margin:0 auto 2px}
#p-main .body{padding-bottom:104px}
.push{height:100%;transform-origin:50% 0;will-change:transform}
.remind{position:relative;margin-top:14px;background:var(--white);border-color:var(--white);box-shadow:0 5px 0 var(--hard);padding-top:24px}
.nametag{position:absolute;top:-15px;left:16px;padding:4px 14px;border-radius:999px;background:var(--you);color:var(--on-yellow);font-size:.76rem;font-weight:900;letter-spacing:.06em;transform:rotate(-3deg);box-shadow:0 3px 0 var(--you-d)}
.kicker{font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--ink3)}
.say{margin-top:8px;font-size:1.04rem;font-weight:800;line-height:1.6}
.opener{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--teal-soft);border:2px dashed #9ADFD6;font-size:.9rem;font-weight:700;line-height:1.6;color:var(--on-teal)}
.opener b{display:block;font-size:.72rem;font-weight:900;letter-spacing:.06em;color:var(--teal-d);margin-bottom:3px}
.line{margin-top:12px;display:flex;gap:8px;align-items:flex-start;font-size:.8rem;font-weight:600;color:var(--ink2)}
.line svg{flex:none;margin-top:3px}
.quiet{text-align:center;padding:26px 18px;background:var(--white);border-color:var(--white);box-shadow:0 5px 0 var(--hard)}
.quiet .big{font-size:1.22rem;font-weight:900;margin-top:8px}
.quiet p{margin-top:6px;font-size:.86rem;color:var(--ink2);font-weight:600}
.tnote{margin-top:16px;padding:12px 14px;border-radius:var(--r-md);background:var(--paper);border:2px dashed var(--line2);font-size:.84rem;font-weight:600;color:var(--ink2);text-align:left;line-height:1.65}
.tnote b{display:block;font-size:.72rem;font-weight:900;letter-spacing:.06em;color:var(--ink2);margin-bottom:2px}
.link{display:block;margin:16px auto 0;padding:8px 16px;font-size:.84rem;font-weight:800;color:var(--teal-d);background:var(--teal-soft);border-radius:999px;transition:all .15s var(--ease)}
.link:hover{background:#D3F3EE}.link.plain{background:none;padding:6px 10px}.link:active{transform:translateY(1px)}
.done{margin-top:16px;padding:11px 14px;border-radius:var(--r-md);background:#EEF7E2;border:2px solid #CFE6B2;font-size:.84rem;font-weight:700;color:#3F6E15}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px;text-align:center;font-weight:900}
.cmp div{padding:12px 6px;border-radius:var(--r-md);background:var(--white);border:2px solid var(--line)}
.cmp b{display:block;font-size:1.55rem;font-weight:900;line-height:1.15}
.cmp span{font-size:.72rem;color:var(--ink2);font-weight:700}
.cmp .hit{background:#EEF7E2;border-color:#CFE6B2}.cmp .miss{background:var(--you-soft);border-color:#F6CFAE}
.check{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--line);font-size:.84rem;font-weight:600;color:var(--ink2)}
.check b{color:var(--ink);font-weight:900}
.check:first-of-type{border-top:0}
.check svg{flex:none;margin-top:3px}

/* ---------- 底部弹层 ---------- */
.scrim{position:absolute;inset:0;z-index:5;background:#3D3428;opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(61,52,40,.18),0 80px 0 var(--bg);transform:translateY(105%);will-change:transform}
.grab{flex:none;padding:14px 0 10px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:42px;height:6px;margin:0 auto;border-radius:3px;background:var(--line2)}
.sheet .x{position:absolute;top:8px;right:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:all .15s var(--ease)}.sheet .x:hover{background:var(--paper)}.sheet .x:active{transform:translateY(2px)}
.sheet h3{flex:none;padding:2px 56px 10px 20px;font-size:1.08rem;font-weight:900}
.sheet .in{overflow-y:auto;padding:0 20px 26px;scrollbar-width:none}
.sheet .in::-webkit-scrollbar{display:none}
.sheet h4{margin:20px 0 9px;font-size:.76rem;font-weight:900;letter-spacing:.06em;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sheet h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}
.sheet h4:first-child{margin-top:4px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.72rem;background:var(--white);border:2px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.tbl th{font-weight:700;color:var(--ink2);text-align:right;padding:6px 6px;background:var(--paper)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:10px}
.tbl td{text-align:right;padding:4px 6px;border-top:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{padding-right:10px}
.tbl tr.wk td{padding-top:8px;font-weight:800;color:var(--ink2);font-family:Nunito,"Noto Sans SC","PingFang SC",sans-serif}
.tbl tr.now td{background:#FCF3C9}
.never{display:flex;flex-wrap:wrap;gap:6px}
.never span{padding:3px 11px;border-radius:999px;background:var(--white);border:1.5px solid var(--line2);font-size:.76rem;font-weight:700;color:var(--ink3);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#E05A5A}
.dev{padding:11px 13px;border-radius:var(--r-sm);background:var(--paper);border:2px dashed var(--line2);font-size:.8rem;font-weight:600;color:var(--ink2);line-height:1.65}
.dev b{color:var(--ink)}
details.dev summary{cursor:pointer;font-weight:800;color:var(--ink);border-radius:8px}details.dev[open] summary{margin-bottom:6px}
.map{margin-top:8px;font-size:.76rem;font-weight:700;color:var(--ink2)}
.extra{margin:0;padding:0;list-style:none}.extra li{padding:7px 0;border-top:2px dashed var(--line);font-size:.8rem;font-weight:600;color:var(--ink2)}.extra li:first-child{border-top:0}.extra b{color:var(--ink);font-weight:900}
.rule{padding:7px 0;border-top:2px dashed var(--line);font-size:.8rem;color:var(--ink2)}
.rule:first-of-type{border-top:0}
.opt{display:block;width:100%;margin-top:14px;padding:13px 18px;border-radius:50px;background:var(--white);text-align:left;font-weight:800;box-shadow:0 5px 0 var(--hard);transition:all .2s var(--ease)}
.opt:first-child{margin-top:4px}
.opt:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--hard)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hard)}

    ${ss.length ? ss.map(s => `<button class="card" data-sess="${cur().sessions.indexOf(s)}"><div class="row">${av(s.f)}<div class="grow"><div class="t1">和${NICK[s.f]}${s.marked ? `<span class="star">${ICON.star}你双击标过</span>` : ""}</div><div class="t2">${s.when} · 聊了 <span style="white-space:nowrap">${mmss(s.sec - s.gray)}</span></div></div>${ICON.chev}</div></button>`).join("") : `<div class="card t2">今天没有记录。</div>`}
    <div class="lbl">我的好友</div>
    <div class="friends">${fs.map(f => `<button data-friend="${f}">${av(f)}${NICK[f]}</button>`).join("") || `<span class="t2">好友都解除了</span>`}</div>
    <div class="note">只有按了豆子的侧键、灯亮着的时候才会录。<br>开录时你们俩各说一句「我是××，开始啦」。<br>只算互相加过好友的人。</div></div>`; }

function paint(el, v, g){ el.style.setProperty("--v", v/100); if (g != null) el.style.setProperty("--guess", g/100); }
function whoLine(s, v){ return `<span>我<i>${cheng(v)}</i></span><span>${NICK[s.f]}<i>${cheng(100-v)}</i></span>`; }

function kidGuess(){ const s = cur().sessions[S.kid.si]; S.kid.guess = 50;
  $("#k-guess").innerHTML = `${bar("先猜后看", "home")}<div class="body">
    <div class="q">猜猜这一段，<br>你和${NICK[s.f]}谁说得多？</div>
    <div class="who" id="g-who">${whoLine(s, 50)}</div>
    <div class="split" id="g-split" role="slider" tabindex="0" aria-label="我说了几成" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="我 5 成"><div class="fill"></div><div class="knob"></div></div>
    <div class="hint">拖动滑块，左边是你，右边是${NICK[s.f]}。<br>1 成就是 10 份里的 1 份。</div>
    <button class="cta" data-go="reveal">猜好了</button>
    <div class="note">豆子戴在你领口：近的声音算你，<br>远的算${NICK[s.f]}，不认声音。</div></div>`;
  bindSplit($("#g-split"), s); }

function bindSplit(el, s){ let raw = 50, grab = 0, anim;
  const set = v => { anim && anim.cancel(); raw = Math.max(0, Math.min(100, v)); S.kid.guess = Math.round(raw/5)*5;
    paint(el, raw); $("#g-who").innerHTML = whoLine(s, S.kid.guess); el.setAttribute("aria-valuenow", S.kid.guess); el.setAttribute("aria-valuetext", "我 " + cheng(S.kid.guess)); };
  const at = e => { const r = el.getBoundingClientRect(); return (e.clientX - grab - r.left)/r.width*100; };
  el.addEventListener("pointerdown", e => { try { el.setPointerCapture(e.pointerId); } catch {} el.classList.add("drag");
    const k = $(".knob", el).getBoundingClientRect(), cx = k.left + k.width/2;
    grab = Math.abs(e.clientX - cx) <= 28 ? e.clientX - cx : 0;            // 抓在手柄上：保留抓取偏移；点在别处：手柄过来
    set(at(e)); });
  el.addEventListener("pointermove", e => { if (el.classList.contains("drag")) set(at(e)); });
  const end = () => { if (!el.classList.contains("drag")) return; el.classList.remove("drag");
    anim = spring({from:raw, to:Math.round(raw/5)*5, response:.25, onUpdate:v => { raw = v; paint(el, v); }}); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("contextmenu", e => e.preventDefault());            // 右键菜单会吞掉 pointerup，手柄会一直跟着鼠标
  el.addEventListener("keydown", e => { const d = {ArrowLeft:-5, ArrowDown:-5, ArrowRight:5, ArrowUp:5}[e.key];
    if (d) set(S.kid.guess + d); else if (e.key === "Home") set(0); else if (e.key === "End") set(100); else return; e.preventDefault(); }); }

let revealAnim, revealTimer;
function kidReveal(){ const s = cur().sessions[S.kid.si], g = S.kid.guess, diff = Math.abs(g - s.share), BAND = 5;
  const talk = s.sec - s.gray, meSec = Math.round(talk*s.share/100); S.kid.gap = g - s.share;
  const msg = diff <= BAND ? `差不多，你猜对了！<small>豆子自己也会量偏一点点，这就算猜对了。</small>`
    : `你猜你说了 ${cheng(g)}，<br>其实是 ${cheng(s.share)}。<small>${s.share < g ? `${NICK[s.f]}说得比你以为的多。` : `你说得比自己以为的多。`}</small>`;
  $("#k-reveal").innerHTML = `${bar(`和${NICK[s.f]} · ${s.when}`, "home")}<div class="body">
    ${s.marked ? `<div class="pill" style="background:#FCEFB4;border-color:#F2D96B;color:var(--on-yellow);margin-top:4px;border-radius:16px">${ICON.star}这一段是你在豆子上双击标的，所以排最前、先问它</div>` : ""}
    <div class="who" id="r-who" style="margin-top:${s.marked ? 22 : 30}px">${whoLine(s, g)}</div>
    <div class="split ro" id="r-split" aria-hidden="true"><div class="fill"></div><div class="ghost"></div></div>
    <div class="verdict" id="r-verdict" aria-live="polite">${msg}</div>
    <div class="card facts">
      <div class="row">一起说了<b>${mmss(talk)}</b></div>
      <div class="row"><span class="dot" style="--c:var(--me)"></span>我说了<b>${mmss(meSec)}</b></div>
      <div class="row"><span class="dot" style="--c:var(--you)"></span>${NICK[s.f]}说了<b>${mmss(talk - meSec)}</b></div>
      <div class="row">一口气说得最久的<b>${s.mono[0] === "me" ? "我" : NICK[s.f]} · ${mmss(s.mono[1])}</b></div>
      <div class="row"><span class="dot" style="--c:var(--gray)"></span>分不清远近，没算进去<b>${mmss(s.gray)}</b></div>
    </div>
    <button class="cta" data-friend="${s.f}">看看我和${NICK[s.f]}</button><button class="cta ghost" data-go="home">回到今天</button></div>`;
  const el = $("#r-split"); paint(el, g, g); revealAnim && revealAnim.cancel(); clearTimeout(revealTimer);
  revealTimer = setTimeout(() => { revealAnim = spring({from:g, to:s.share, response:.75, onUpdate:v => { paint(el, v); const w = $("#r-who"); if (w) w.innerHTML = whoLine(s, Math.round(v)); },
    onDone:() => { const v = $("#r-verdict"); if (v){ v.innerHTML = msg; v.classList.add("on"); } }}); }, REDUCED ? 0 : 420); }   // 在已存在的 live 区域里重新赋值，读屏才会播报

function kidFriend(f){ const n = now()[f], head = `${bar("", S.kid.from)}<div class="body">
    <div class="row" style="margin-top:4px">${av(f)}<div><div class="t1" style="font-size:1.2rem">${NICK[f]}</div><div class="t2">好友 · 两边的爸爸妈妈都点过同意</div></div></div>`;
  if (!n || !n.minutes){ $("#k-friend").innerHTML = `${head}<div class="lbl">这一周</div><div class="card t2" style="font-size:.88rem;line-height:1.7">这周没有和${NICK[f]}的记录。<br>按了键才会录，没有记录不等于没在一起。</div></div>`; return; }
  const past = k => series(f, x => x[k]).slice(0, -1).filter(v => v != null);
  const a = {t:arrow(n.minutes, past("minutes")), d:arrow(n.days, past("days")), s:arrow(sym(n.share), series(f, x => x.minutes ? sym(x.share) : null).slice(0, -1).filter(v => v != null))};
  const why = [a.t !== "flat" && "在一起的时间", a.d !== "flat" && "说上话的天数", a.s !== "flat" && "两个人说得平不平均"].filter(Boolean).join("、");
  const sign = k => a[k] === "flat" ? "＝" : ARW[a[k]];
  $("#k-friend").innerHTML = `${head}
    <div class="lbl">我们俩 · 和以前的自己比</div>
    <div class="card">${spark(series(f, inti), "var(--teal-d)", 70)}<div class="t2" style="margin-top:6px;text-align:center">${why ? `这周变的是：${why}` : "这周和以前差不多"}</div></div>
    <div class="parts">
      <div class="part"><div class="arrow ${a.t}">${sign("t")}</div><div>一起说话<br>的时间</div></div>
      <div class="part"><div class="arrow ${a.d}">${sign("d")}</div><div>有几天<br>说上了话</div></div>
      <div class="part"><div class="arrow ${a.s}">${sign("s")}</div><div>两个人说得<br>有多平均</div></div>
    </div>
    <div class="note">没有分数，没有排名，也不和别人比。<br>只有你和爸爸妈妈看得到。</div></div>`; }

function parent(){ $$(".tabs button").forEach(b => b.dataset.tab === S.par.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#p-body").innerHTML = (S.par.delFail ? `<div class="redbar" role="status">${ICON.no}<span>设备上仍有录音：豆子里有 1 个文件没删掉，下次连接时再删。</span></div>` : "") + ({week:parWeek, trend:parTrend, trust:parTrust})[S.par.tab](); $("#p-body").scrollTop = 0; }

const num = (o, v) => `${v}${UNIT[o.metric].trim()}`;
function recoveryText(o){ return `和${NICK[o.friend]}聊天时，${METRIC[o.metric]}${o.recovery_op === ">=" ? "回到" : "降到"} ${num(o, o.recovery_value)} ${o.recovery_op === ">=" ? "以上" : "以下"}`; }
const lineText = (o, hit) => `${hit ? "" : "还没"}${o.recovery_op === ">=" ? "回到" : "降到"} ${num(o, o.recovery_value)} ${o.recovery_op === ">=" ? "以上" : "以下"}${hit ? "了" : ""}`;
const devWhy = o => `<details class="dev"><summary>它给开发者的理由</summary>${esc(o.reason)}</details>`;
function assistCard(o, tag){ return `<div class="card remind"${tag ? ' style="margin-top:28px"' : ""}><span class="nametag">豆伴助手${tag || ""}</span>` + (o.remind
    ? `<div class="kicker">${tag ? "新一周的数字出来之后" : "这周值得留意的一个变化"}</div><div class="say">${nick(o.sentence)}</div>
      <div class="opener"><b>可以这样开口</b>${nick(o.opener)}</div><div class="line">${ICON.flag}<span>下周自动对照：${recoveryText(o)}</span></div>`
    : `<div class="kicker">新一周的数字出来之后</div><div class="say">这一条不再提了。</div>${o.trend_note ? `<div class="tnote"><b>助手留在趋势页的一句话</b>${nick(o.trend_note)}</div>` : ""}`); }

function parWeek(){ const c = cur(), o = c.assistant, total = weeks().at(-1).total_days;
  let card;
  if (o.remind && !alive(o.friend)) card = `<div class="card quiet">${ICON.calm}<div class="big">这周不提醒</div><p>和${NICK[o.friend]}的数字，已随好友关系一并删除。</p></div>`;
  else if (o.remind){ const nowV = now()[o.friend][o.metric], nx = S.par.next && c.next[S.par.next], hit = nx != null && (o.recovery_op === ">=" ? nx >= o.recovery_value : nx <= o.recovery_value);
    const r2 = nx != null && !hit && c.round2 && c.round2[S.par.reason];
    card = assistCard(o) + (S.par.reason
        ? `<div class="done">已记下：${esc(S.par.reason)}。下周的数字出来后自动对照，不用你再做什么。
            <div class="time-ctl"><span>演示：快进到下一周</span><button data-next="yes" aria-pressed="${S.par.next === "yes"}">到了</button><button data-next="no" aria-pressed="${S.par.next === "no"}">还没到</button></div></div>`
        : `<button class="cta" data-act="talked">聊过了</button>`)
      + `<button class="link" data-act="ai">AI 读到了什么？固定规则会报 ${c.rule.length} 条 →</button></div>`
      + (nx != null ? `<div class="lbl">下一周 · 自动对照</div><div class="card"><div class="t1">${lineText(o, hit)}</div>
        <div class="cmp"><div><b>${num(o, nowV)}</b><span>提醒那一周</span></div><span aria-hidden="true">→</span><div class="${hit ? "hit" : "miss"}"><b>${num(o, nx)}</b><span>下一周</span></div></div>
        <div class="t2" style="margin-top:12px">${hit ? "这条提醒到此结束。到没到线，是程序判的，不是助手说了算。" : r2 ? "助手读了新一周的数字和你选的原因，给出了第二轮：" : "接下来由助手决定：换一种开口方式、调低对照的那条线，或者不再提。"}</div></div>
        ${r2 ? assistCard(r2, " · 第二轮") + devWhy(r2).replace('class="dev"', 'class="dev" style="margin-top:14px"') + "</div>"
          + (new Set(c.round2_runs[S.par.reason]).size > 1 ? `<div class="tnote" style="margin-top:12px"><b>照实说明</b>这一情形真实跑了 ${c.round2_runs[S.par.reason].length} 次，几次的决定不一样（有的再提一次，有的不再提）。这里放的是第 1 次。</div>` : "") : ""}` : ""); }
  else card = `<div class="card quiet">${ICON.calm}<div class="big">这周不提醒</div><p>助手看过这周的数字，决定不打扰你。</p>
      <button class="link" data-act="ai">为什么不提醒？固定规则会报 ${c.rule.length} 条 →</button></div>`;
  return `<div class="hello">小明的这一周</div><div class="sub">本周有记录 ${total} 天 · 每周最多一条提醒</div><div style="height:18px"></div>${card}
    <div class="note">这里没有播放键。录音算完就删，<br>留下的只有数字。</div>`; }

function parTrend(){ const fs = allF().filter(alive), o = cur().assistant;
  return `<div class="hello">趋势</div><div class="sub">只和孩子自己的过去比，不和别人比</div><div style="height:18px"></div>`
    + (o.trend_note && !gone() ? `<div class="tnote" style="margin:0 0 12px"><b>助手这周的一句话</b>${nick(o.trend_note)}</div>` : "")
    + (fs.map(f => { const n = now()[f], real = series(f, x => x.minutes ? x.share : null).filter(v => v != null);
    const past = k => series(f, x => x[k]).slice(0, -1).filter(v => v != null), am = arrow(n ? n.minutes : 0, past("minutes")), ad = arrow(n ? n.days : 0, past("days"));
    return `<div class="card trend"><div class="row">${av(f, 1)}<div class="grow t1">${NICK[f]}</div></div>
      ${n && n.minutes ? `<div style="margin-top:10px">${spark(real, COLOR[f])}</div><div class="t2" style="display:flex;justify-content:space-between"><span>${real[0]}%</span><span>说话占比 · 近 ${real.length} 周</span><span>${real.at(-1)}%</span></div>
      <div class="nums"><span>一起说话的时间 <span class="${am}">${ARW[am]}</span></span><span>有记录的天数 <span class="${ad}">${ARW[ad]}</span></span></div>`
      : `<div class="t2" style="margin-top:10px">这周没有和${NICK[f]}的记录。<br>孩子按键才录，没有记录不等于没在一起。</div>`}</div>`; }).join("") || `<div class="card t2">没有好友了。</div>`); }

function parTrust(){ const fs = allF().filter(alive), bad = S.par.delFail;

    + `<div class="card"><div class="check">${ICON.ok}<span>加好友要两边家长各点一次同意。同意之前，和 TA 的谈话不会被计算。</span></div></div>

      <div class="check">${ICON.ok}<span>这个 App 没有播放键，家长听不到任何一句。</span></div>
      <div class="check">${ICON.ok}<span>任何一方的家长都能解除好友；解除后，这段关系的数字两边一并删除。</span></div>
      <div class="time-ctl"><span>演示：假如豆子上删不掉</span><button data-act="delfail" aria-pressed="${!!bad}">${bad ? "恢复正常" : "试一下"}</button></div></div>`; }

function aiSheet(){ const c = cur(), o = c.assistant, ws = weeks(), g = gone(), seen = allF().filter(alive);
  const rows = ws.map((w, i) => `<tr class="wk"><td colspan="5">${i === ws.length-1 ? "本周" : `${ws.length-1-i} 周前`} · 有记录 ${w.total_days} 天</td></tr>` +
    Object.entries(w.friends).filter(([f]) => alive(f)).map(([f, m]) => `<tr class="${i === ws.length-1 ? "now" : ""}"><td>${f}</td><td>${m.share}</td><td>${m.monolog_s}</td><td>${m.minutes}</td><td>${m.days}</td></tr>`).join("")).join("");
  const checks = c.errors.length ? c.errors.map(e => `<div class="check">${ICON.no}<span>${esc(e)}</span></div>`).join("")
    : ["指标在白名单内（四项之一，亲密度组合分不在内）", o.remind ? "下周对照的那条线（恢复线）测得出，而且本周还没满足" : "不提醒：没有恢复线要查", "没有禁用措辞（不判定、不贴标签）"].map(t => `<div class="check">${ICON.ok}<span>${t}</span></div>`).join("");
  const zh = s => esc(s).replace(/minutes/g, "时长").replace(/days/g, "次数").replace(/share/g, "占比");
  const nx = S.par.next && c.next && c.next[S.par.next], extra = [
    o.remind && S.par.next && `上次提醒：<b>${METRIC[o.metric]}</b>，恢复线 <b>${o.recovery_op} ${num(o, o.recovery_value)}</b>，下一周 <b>${num(o, nx)}</b>，程序判定<b>${(o.recovery_op === ">=" ? nx >= o.recovery_value : nx <= o.recovery_value) ? "到了" : "还没到"}</b>`,
    S.par.reason && `家长选的原因：<b>${esc(S.par.reason)}</b>`,
    S.kid.gap != null && `孩子的猜测与实测之差：<b>${S.kid.gap > 0 ? "+" : ""}${S.kid.gap} 个百分点</b>`].filter(Boolean);
  return ["AI 读到了什么", (g ? `<div class="dev">有好友已经解除。和 TA 有关的数字、助手这周的理由、规则对照，都已一并删除，这里不再显示。</div>`
      : `<div class="cmp" style="margin-top:2px"><div><b>${c.rule.length} 条</b><span>固定阈值规则会报</span></div><span aria-hidden="true">vs</span><div class="hit"><b>${o.remind ? 1 : 0} 条</b><span>助手决定发</span></div></div>`)
    + `<h4>发给助手的全部内容</h4>
    <table class="tbl mono"><tr><th>代号</th><th>占比%</th><th>独白s</th><th>时长min</th><th>天数</th></tr>${rows}</table>
    <div class="map">${seen.map(f => `${f} 就是${NICK[f]}`).join("，")}。昵称只在这台手机上替换，模型看到的只有代号。</div>
    ${extra.length ? `<h4>下一轮还会一起发</h4><ul class="extra">${extra.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
    <h4>从来不发</h4><div class="never"><span>音频</span><span>转写文字</span><span>摘要</span><span>姓名</span><span>声纹</span></div>`
    + (g ? "" : `<h4>助手的决定 · ${o.remind ? "提醒" : "本周不提醒"}</h4>${devWhy(o)}
    <h4>程序校验</h4>${checks}
    <h4>同一批数字，固定阈值规则会报 ${c.rule.length} 条</h4>${c.rule.map(r => `<div class="rule mono">${zh(r)}</div>`).join("")}`)
    + `<div class="note" style="text-align:left">模型 claude-fable-5-1，2026-09-19 实测输出；数字为示意。</div><button class="cta ghost" data-act="close">关闭</button>`]; }
const reasonSheet = () => ["聊过了 · 大概是因为？", ["换座位了", "闹别扭了", "没什么事", "还不清楚"].map(r => `<button class="opt" data-reason="${r}">${r}</button>`).join("")
  + `<div class="note" style="text-align:left">选一个就行。助手下周会把它当成一条输入；比如选了「换座位了」，要不要把现状当成新的基线，由助手决定。</div><button class="cta ghost" data-act="close">先不选</button>`];
const removeSheet = f => [`解除和${NICK[f]}的好友关系？`, `<p class="t2" style="font-size:.9rem;line-height:1.7">解除后，和${NICK[f]}有关的全部数字会一并删除，两边都看不到了，不能恢复。</p><button class="cta danger" data-confirm-remove="${f}">解除并删除数字</button><button class="cta ghost" data-act="close">再想想</button>`];

/* ---------- 弹层：弹簧驱动，拖得动，松手看速度的方向 ---------- */
const sheet = $(".sheet"), scrim = $(".scrim"), push = $(".push");
let sp = 1, sAnim, lastFocus;                                    // sp：0 全开，1 全关
function sheetPaint(p){ sp = p; const o = Math.max(0, 1-p); sheet.style.transform = `translateY(${p*105}%)`; scrim.style.opacity = o*.38;
  scrim.style.pointerEvents = p < 1 ? "auto" : "none";            // 遮罩能不能点，只由画出来的状态决定，任何路径都不会漏
  push.style.transform = `scale(${1 - Math.min(1, o)*.045})`; push.style.borderRadius = o > .01 ? "24px" : ""; push.style.overflow = o > .01 ? "hidden" : ""; }
function sheetTo(target, velocity=0){ sAnim && sAnim.cancel();
  sAnim = spring({from:sp, to:target, velocity, response:.34, damping:velocity ? .82 : 1, onUpdate:sheetPaint,
    onDone:() => { if (target){ sheet.hidden = true; $("#p-main").inert = false; $(".tabs").inert = false;
      (lastFocus && lastFocus.isConnected ? lastFocus : $("#p-body")).focus({preventScroll:true}); } }}); }
function openSheet([title, html]){ lastFocus = document.activeElement; $("#sh-title").textContent = title; $(".in", sheet).innerHTML = html; $(".in", sheet).scrollTop = 0;
  sheet.hidden = false; $("#p-main").inert = true; $(".tabs").inert = true; sheetTo(0); sheet.focus({preventScroll:true}); }
const closeSheet = (v=0) => sheetTo(1, v);
sheet.hidden = true;
(() => { const g = $(".grab"); let y0, h, hist;
  g.addEventListener("pointerdown", e => { sAnim && sAnim.cancel(); try { g.setPointerCapture(e.pointerId); } catch {} h = sheet.offsetHeight*1.05; y0 = e.clientY - sp*h; hist = [[e.clientY, e.timeStamp]]; });
  g.addEventListener("pointermove", e => { if (!hist || sheet.hidden){ hist = null; return; } let d = e.clientY - y0; if (d < 0) d = -rubber(-d, h, .3);
    sheetPaint(d/h); hist.push([e.clientY, e.timeStamp]); if (hist.length > 5) hist.shift(); });
  const end = e => { if (!hist) return; const a = hist[0], b = hist.at(-1);
    const v = (e.timeStamp - b[1] < 80 && b[1] > a[1]) ? (b[0]-a[0])/(b[1]-a[1])*1000 : 0; hist = null;   // 停住再松手：速度样本已过期，按静止算
    if (sheet.hidden) return; const landing = sp*h + project(v), close = landing > h*.45; sheetTo(close ? 1 : 0, v/h); };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end); })();
scrim.addEventListener("click", () => closeSheet());
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

/* ==================== 事件与启动 ==================== */
function caption(){ const c = cur(); $("#cap").innerHTML = `<b>三种情形，同一个助手。</b>这一情形：固定阈值规则会报 <b>${c.rule.length} 条</b>，助手${c.assistant.remind ? "<b>只发 1 条</b>" : "<b>决定一条都不发</b>"}。数字是示意；助手的每一句话、每一次提醒或不提醒，都是真实模型输出，并通过了程序校验。`; }
function resetAll(){ S.kid = {view:"home", si:0, guess:50, from:"home", gap:null}; S.par.tab = "week"; S.par.reason = null; S.par.next = null;
  if (!sheet.hidden){ sAnim && sAnim.cancel(); sheetPaint(1); sheet.hidden = true; $("#p-main").inert = false; $(".tabs").inert = false; }
  clearTimeout(revealTimer); caption(); kidHome(); kidGo("home"); parent(); }
$("#cases").innerHTML = UI.map((u, i) => `<button data-ci="${i}" aria-pressed="${i === 0}">${u.tab}</button>`).join("");
document.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.ci != null){ S.ci = +d.ci; $$("#cases button").forEach(x => x.setAttribute("aria-pressed", x === b)); resetAll(); }
  else if (d.show){ $(".stage").dataset.show = d.show; $$(".which button").forEach(x => x.setAttribute("aria-pressed", x === b)); }
  else if (d.sess != null){ S.kid.si = +d.sess; kidGuess(); kidGo("guess"); }
  else if (d.go === "reveal"){ kidReveal(); kidGo("reveal"); }
  else if (d.go){ if (d.go === "home") kidHome(); kidGo(d.go); }
  else if (d.friend){ S.kid.from = S.kid.view; kidFriend(d.friend); kidGo("friend"); }
  else if (d.tab){ S.par.tab = d.tab; parent(); }
  else if (d.act === "ai") openSheet(aiSheet());
  else if (d.act === "talked") openSheet(reasonSheet());
  else if (d.act === "remove") openSheet(removeSheet(d.f));
  else if (d.act === "close") closeSheet();
  else if (d.act === "delfail"){ S.par.delFail = !S.par.delFail; parent(); kidHome(); const t = $('#p-body [data-act="delfail"]'); t && t.focus({preventScroll:true}); $("#p-body").scrollTop = 1e4; }
  else if (d.reason){ S.par.reason = d.reason; parent(); closeSheet(); }
  else if (d.confirmRemove){ S.par.removed[S.ci + d.confirmRemove] = true; parent(); kidHome(); kidGo("home"); closeSheet(); }
  else if (d.next){ S.par.next = S.par.next === d.next ? null : d.next; parent(); const t = $(`#p-body [data-next="${d.next}"]`); t && t.focus({preventScroll:true});
    const el = $("#p-body"), to = $("#p-body .lbl"); el.scrollTo({top:to ? to.offsetTop - 12 : 0, behavior:REDUCED ? "auto" : "smooth"}); } });
if (!REAL.length) document.body.innerHTML = '<p style="padding:40px;text-align:center">还没有注入真实数据（REAL 为空）。</p>'; else resetAll();
</script>
</body>
